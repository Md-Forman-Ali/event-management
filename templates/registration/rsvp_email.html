<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Inter', sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e1e1e1; border-radius: 12px; }
        .header { background-color: #10b981; color: white; padding: 20px; text-align: center; border-top-left-radius: 12px; border-top-right-radius: 12px; }
        .content { padding: 30px; }
        .details { background-color: #f9fafb; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .footer { text-align: center; padding: 20px; color: #777; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RSVP Confirmed!</h1>
        </div>
        <div class="content">
            <p>Hi {{ user.username }},</p>
            <p>You have successfully RSVP'd for the following event:</p>
            <div class="details">
                <p><strong>Event:</strong> {{ event.name }}</p>
                <p><strong>Date:</strong> {{ event.date }}</p>
                <p><strong>Time:</strong> {{ event.time }}</p>
                <p><strong>Location:</strong> {{ event.location }}</p>
            </div>
            <p>We look forward to seeing you there!</p>
        </div>
        <div class="footer">
            <p>&copy; 2025 EventMaster Inc. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
